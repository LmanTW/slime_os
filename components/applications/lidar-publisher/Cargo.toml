[package]
name = "slime-component-lidar-publisher"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"
build = "build.rs"

[[bin]]
name = "lidar-publisher"
path = "src/main.rs"
test = false

[dependencies]
slime-components = { path = "../../lib" }
slime-proto = { path = "../../proto" }
# The link's reassembly heap and the one frame buffer come from the generation-declared private
# region. `private-heap` registers its own `#[global_allocator]`, so the builder compiles this
# crate in the private-heap group; `just component_crate_split_check` pins the grouping.
slime-rt = { path = "../../runtime", features = ["private-heap"] }

[build-dependencies]
slime-build-support = { path = "../../build-support" }

[lints]
workspace = true
