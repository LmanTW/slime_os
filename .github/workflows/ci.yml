name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Superseded runs waste arm64 capacity. Cancel on branch pushes too, not just
# pull requests, so a newer run can start without waiting for obsolete work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SLIME_ZUTAI_JOBS: '2'

jobs:
  # Cheap, always-run scope detection. A change confined to `.tasks/` (the
  # canonical work-item store, e.g. an automated retirement batch) touches no
  # code, contract, or generation surface, so every job below that builds or
  # boots something is skipped for it. Anything else — including a mix of
  # `.tasks/` and code — runs the full suite; uncertainty defaults to `true`.
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [[ -z "$base" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"
          echo "$changed"
          if [[ -n "$changed" ]] && ! echo "$changed" | grep -qvE '^\.tasks/'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # A pull request that adds a work item may not also change the product
  # tree: the item lands first, then its implementation. The classes come
  # from `.devloop/policy.json`; see CONTRIBUTING.md "Pull request scope".
  pr_scope:
    name: Pull request scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          python3 scripts/check/check-pr-scope.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  # === Jobs that need neither the seL4 prefix nor Nix ===
  #
  # These run on the ordinary x64 runner with a plain toolchain, because
  # nothing they check compiles against libsel4.

  lint:
    name: Format and host clippy
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-05-26
          components: clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just fmt_check_all
      # Host-capable cutover crates only. The seL4 target crates need the
      # pinned prefix and run in `sel4_product` below.
      - run: just lint_boot_contracts lint_components_host

  sel4_pins:
    name: seL4 pins
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Static pin validation only: submodule commits and origins, the seL4
      # release, both Rust toolchain pins, the root target spec bytes, and the
      # qemu-arm-virt kernel configuration. `--skip-host-tools` drops the
      # installed-rustup and QEMU-version assertions, which belong to the
      # machine that actually builds and boots the image.
      - run: python3 scripts/check/check-sel4-pins.py --skip-host-tools

  test_host:
    name: Host tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-05-26
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just test_host

  miri_packages:
    name: Miri (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: boot-contracts
            recipe: miri_boot_contracts
            cache-key: boot-contracts
          - package: slime-proto
            recipe: miri_proto
            cache-key: slime-proto
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-05-26
          components: miri,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.cache-key }}
      - uses: extractions/setup-just@v4
      - run: just ${{ matrix.recipe }}

  miri:
    name: Miri (boot-contracts, slime-proto)
    runs-on: ubuntu-latest
    needs: [miri_packages]
    if: always()
    steps:
      - run: |
          result="${{ needs.miri_packages.result }}"
          test "$result" = success || test "$result" = skipped

  deps:
    name: cargo-deny and machete
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo-machete boot-contracts components slime-root

  scripts:
    name: ruff and typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly: this action publishes no floating `v4` tag.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check scripts/
      - uses: crate-ci/typos@v1

  docs_gates:
    name: Docs, portability, and gate controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: extractions/setup-just@v4
      # Every gate here reads the tree and nothing else: no seL4 prefix, no
      # cargo build, no QEMU. `sel4_gate_control_check` drives each seL4 gate's
      # own marker table with transcripts that are wrong in one specific way,
      # so it runs anywhere the checkers import.
      - run: just x86_portability_check
      - run: just framework_safety_check
      - run: just docs_check
      # The matrix check reads only the locked smoltcp archive, and refuses it
      # unless its SHA-256 matches Cargo.lock, so one download replaces a
      # toolchain and a workspace fetch.
      - name: Fetch the locked smoltcp archive
        run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "smoltcp"))')
          mkdir -p "$RUNNER_TEMP/cargo/registry/cache/crates.io"
          curl --fail --silent --show-error --location --output \
            "$RUNNER_TEMP/cargo/registry/cache/crates.io/smoltcp-$version.crate" \
            "https://static.crates.io/crates/smoltcp/smoltcp-$version.crate"
      - run: just smoltcp_matrix_check
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo
      - run: just sel4_gate_control_check
      - run: python3 scripts/check/check-generation-v5.py --check-controls

  work_items:
    name: Canonical work-item store
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Separate from `docs_gates` on purpose. That job's whole toolchain is a
    # checkout plus `just`, and `docs_check` is deliberately binary-free so
    # it stays that cheap. This gate runs `myque check`, which needs the dev
    # shell shared with projection, closeout and retirement.
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # All tool-cache consumers realize the same projection shell. Keep its
      # key inputs aligned with the projection, closeout and retirement jobs;
      # unrelated product lockfiles must not invalidate this tool closure.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: >-
            projection-v2-${{ runner.os }}-${{ runner.arch }}-${{
              hashFiles('flake.lock', 'flake.nix', 'nix/devloop.nix', 'nix/zutai.nix')
            }}
          restore-prefixes-first-match: projection-v2-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 5G

      # Keep the shell closure rooted through cache-nix-action's post-job GC/save.
      - name: Root shared tool environment
        run: nix develop .#projection --profile "$RUNNER_TEMP/projection-profile" --command true

      - run: nix develop .#projection --command just tasks_check

      - name: Checkout trusted retirement verifier
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/myque-retire/')
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: retirement-verifier
          persist-credentials: false

      - name: Verify retirement against current main
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/myque-retire/')
        working-directory: retirement-verifier
        env:
          RETIREMENT_HEAD_REF: ${{ github.head_ref }}
          RETIREMENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          nix develop .#projection --command
          python3 scripts/lib/work_item_retirement_publish.py --check-pr

  kani_proofs:
    name: Kani IO wire and device-boundary proofs
    # An ordinary x64 runner, not the arm64 seL4 pool: nothing here builds for
    # AArch64, links libsel4, or boots QEMU. `verification/io-proofs` is a
    # zero-dependency crate compiled by Kani's own bundled toolchain, so this
    # job needs neither the seL4 prefix nor a cargo cache.
    #
    # x86_64 is also deliberate coverage rather than just availability: the
    # derivation was developed and observed on `aarch64-darwin`, so this is the
    # first run of the Linux bundle and its `autoPatchelfHook` path.
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Observed warm on aarch64-darwin: 17 seconds. Cold here additionally
    # fetches a ~143 MB release bundle and the pinned nightly, so the bound
    # covers a cold cache and catches a wedged solver rather than a slow run.
    timeout-minutes: 30
    steps:
      # No `submodules: recursive`: this gate reads `components/proto/src`,
      # `verification/io-proofs`, and the flake. It touches nothing in `deps/`.
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # Keyed on the kani pin alone, so an unrelated `sel4/pins.toml` or
      # `Cargo.lock` change does not evict a 2.3 GiB closure. No `~/.rustup` or
      # `~/.cargo` here: `kani-driver` uses the toolchain its bundle links
      # against, out of the store, and the crate under proof has no
      # dependencies to fetch.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: >-
            kani-${{ runner.os }}-${{ runner.arch }}-${{
              hashFiles('flake.lock', 'flake.nix', 'nix/kani.nix')
            }}
          restore-prefixes-first-match: kani-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 5G

      # Separate from the gate on purpose. This step failing means the pinned
      # bundle hash, the pinned nightly, or the derivation's own
      # verify-a-harness install check is wrong; the gate step failing means a
      # proof is. Collapsing them would report a broken pin as a broken proof.
      - name: Realize the pinned Kani
        run: nix build .#kani

      - run: nix develop .#kani --command just kani_io_proofs

      # Same shell, same bundle, different trust boundary: these prove the
      # arithmetic applied to bytes a *device* wrote. Run in this job rather
      # than a new one so the ~325 MB Kani closure is realized once.
      - run: nix develop .#kani --command just kani_virtio_proofs

  # === Jobs that need the installed seL4 prefix ===
  #
  # `aarch64-sel4-qemu-virt` is an AArch64 target and every gate below either
  # cross-compiles for it or boots it under QEMU, so these run on the arm64
  # runner: it is the native architecture for this product, and free for public
  # repositories. They enter this repository's own Nix dev shell, which is the
  # only supported environment — `sel4/pins.toml` binds the kernel hashes to
  # the exact cross toolchain, CMake, Ninja, and Python generators that shell
  # provides, so building outside it reports as toolchain drift.

  sel4_product:
    name: Pinned seL4 image, lint, and root tests
    runs-on: ubuntu-24.04-arm
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Observed cold: 8 minutes. The bound catches a wedged QEMU or a stalled
    # build, so it is roughly triple the observation rather than a guess.
    timeout-minutes: 30
    steps:
      # Before `slime-env`: a local action is resolved from the checked-out
      # tree, so the tree must exist first.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/slime-env
      # Produces `build/sel4-prefix` and the platform-qualified root child ELF
      # every later step in this job consumes. It also re-checks the pinned
      # artifact hashes, so toolchain drift fails here rather than downstream.
      - run: nix develop --command just sel4_qemu_image_check
      - run: nix develop --command just lint_sel4_root
      - run: nix develop --command just test_sel4_root
      - uses: ./.github/actions/slime-zutai-store-save
        if: always()
        with:
          checks-completed: ${{ job.status == 'success' }}

  sel4_rollback_runtime:
    name: Rollback runtime, release trust, and BootState trace
    runs-on: ubuntu-24.04-arm
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/slime-env
        with:
          build-partition: image
          build-save: 'false'
      - run: nix develop --command just sel4_qemu_image_check
      - run: nix develop --command just bootstate_trace_check release_trust_runtime_check
      - uses: ./.github/actions/slime-zutai-store-save
        if: always()
        with:
          checks-completed: ${{ job.status == 'success' }}

  sel4_contract_sources:
    name: Contract sources and component specs
    runs-on: ubuntu-24.04-arm
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/slime-env
        with:
          build-partition: image
          build-save: 'false'
      - run: nix develop --command just sel4_qemu_image_check
      # Samples memory every 30 seconds so a job that the runner ends without a
      # failing assertion leaves the figures it held at that time.
      - name: Sample memory
        run: |
          cat > "$RUNNER_TEMP/sample-memory.sh" <<'SCRIPT'
          while :; do
            echo "$(date -u +%T) $(free -m | awk '/Mem:/{print "used=" $3 "MB avail=" $7 "MB"}') top: $(ps -eo rss=,comm= --sort=-rss | head -3 | tr -s ' ' | tr '\n' ';')"
            sleep 30
          done
          SCRIPT
          nohup sh "$RUNNER_TEMP/sample-memory.sh" > "$RUNNER_TEMP/memory.log" 2>&1 &
      # Split from `sel4_system_image_builder` so the two chains run
      # concurrently. Together the two jobs run exactly the recipes the single
      # job ran; `component_spec_validation_check` (seconds) runs in both
      # because `system_image_builder_check` depends on it.
      - run: >-
          nix develop --command just
          contracts_source_check component_spec_validation_check
      - name: Report memory
        if: always()
        run: |
          echo "Last memory samples, rss in KB:"
          tail -n 60 "$RUNNER_TEMP/memory.log" || true
          echo "Kernel lines about memory kills:"
          (sudo dmesg 2>/dev/null || true) | grep -i -E 'out of memory|oom|killed process' | tail -n 20 || true
      - uses: ./.github/actions/slime-zutai-store-save
        if: always()
        with:
          checks-completed: ${{ job.status == 'success' }}

  sel4_system_image_builder:
    name: System specs and system-image closures
    runs-on: ubuntu-24.04-arm
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/slime-env
        # Saves the build-output partition the image-only jobs share: its
        # outputs are the builder check's plus the image every job builds.
        with:
          build-partition: image
      - run: nix develop --command just sel4_qemu_image_check
      # Samples memory every 30 seconds so a job that the runner ends without a
      # failing assertion leaves the figures it held at that time.
      - name: Sample memory
        run: |
          cat > "$RUNNER_TEMP/sample-memory.sh" <<'SCRIPT'
          while :; do
            echo "$(date -u +%T) $(free -m | awk '/Mem:/{print "used=" $3 "MB avail=" $7 "MB"}') top: $(ps -eo rss=,comm= --sort=-rss | head -3 | tr -s ' ' | tr '\n' ';')"
            sleep 30
          done
          SCRIPT
          nohup sh "$RUNNER_TEMP/sample-memory.sh" > "$RUNNER_TEMP/memory.log" 2>&1 &
      # Closures are digests of source trees; a merge that touches one without
      # regenerating them makes every plane gate refuse to resolve. Fail here,
      # on the clean checkout, rather than in whichever QEMU job runs first.
      - run: nix develop --command just system_image_builder_check
      - name: Report memory
        if: always()
        run: |
          echo "Last memory samples, rss in KB:"
          tail -n 60 "$RUNNER_TEMP/memory.log" || true
          echo "Kernel lines about memory kills:"
          (sudo dmesg 2>/dev/null || true) | grep -i -E 'out of memory|oom|killed process' | tail -n 20 || true
      - uses: ./.github/actions/slime-zutai-store-save
        if: always()
        with:
          checks-completed: ${{ job.status == 'success' }}

  sel4_generations:
    name: Generation v5 (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The four shards build the same image and share one build-output
      # partition that shard 0 saves; each keeps its own evaluation store.
      - uses: ./.github/actions/slime-env
        with:
          build-cache-key: generation-${{ matrix.shard }}
          build-partition: generation
          build-save: ${{ matrix.shard == 0 }}
      - run: nix develop --command just sel4_qemu_image_check
      - run: nix develop --command just generation_v5_check ${{ matrix.shard }} 4
      - uses: ./.github/actions/slime-zutai-store-save
        if: always()
        with:
          checks-completed: ${{ job.status == 'success' }}

  sel4_contracts:
    name: Contracts and component specs
    runs-on: ubuntu-latest
    needs: [sel4_contract_sources, sel4_system_image_builder, sel4_generations]
    if: always()
    steps:
      # The seL4 jobs report `skipped` rather than `success` for a
      # `.tasks/`-only change (see `changes` above); that is this aggregate's
      # success too, not a failure to paper over.
      - run: |
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          ok "${{ needs.sel4_contract_sources.result }}"
          ok "${{ needs.sel4_system_image_builder.result }}"
          ok "${{ needs.sel4_generations.result }}"

  sel4_rollback:
    name: Rollback, release trust, and BootState trace
    runs-on: ubuntu-latest
    needs: [sel4_rollback_runtime, sel4_contract_sources, sel4_system_image_builder, sel4_generations]
    if: always()
    steps:
      - run: |
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          ok "${{ needs.sel4_rollback_runtime.result }}"
          ok "${{ needs.sel4_contract_sources.result }}"
          ok "${{ needs.sel4_system_image_builder.result }}"
          ok "${{ needs.sel4_generations.result }}"

  CI:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - changes
      - pr_scope
      - lint
      - sel4_pins
      - test_host
      - miri_packages
      - miri
      - deps
      - scripts
      - docs_gates
      - work_items
      - kani_proofs
      - sel4_product
      - sel4_rollback_runtime
      - sel4_contract_sources
      - sel4_system_image_builder
      - sel4_generations
      - sel4_contracts
      - sel4_rollback
    if: always()
    steps:
      # `scripts`, `docs_gates`, and `work_items` are cheap and always run, so
      # they must actually succeed. Every other job is skipped on purpose for
      # a `.tasks/`-only change (`needs.changes.outputs.code == 'false'`);
      # `skipped` is as good as `success` for those.
      - run: |
          test "${{ needs.scripts.result }}" = success
          test "${{ needs.docs_gates.result }}" = success
          test "${{ needs.work_items.result }}" = success
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          # `pr_scope` is skipped on pushes; on a pull request it must pass.
          ok "${{ needs.pr_scope.result }}"
          ok "${{ needs.lint.result }}"
          ok "${{ needs.sel4_pins.result }}"
          ok "${{ needs.test_host.result }}"
          ok "${{ needs.miri_packages.result }}"
          ok "${{ needs.miri.result }}"
          ok "${{ needs.deps.result }}"
          ok "${{ needs.kani_proofs.result }}"
          ok "${{ needs.sel4_product.result }}"
          ok "${{ needs.sel4_rollback_runtime.result }}"
          ok "${{ needs.sel4_contract_sources.result }}"
          ok "${{ needs.sel4_system_image_builder.result }}"
          ok "${{ needs.sel4_generations.result }}"
          ok "${{ needs.sel4_contracts.result }}"
          ok "${{ needs.sel4_rollback.result }}"
